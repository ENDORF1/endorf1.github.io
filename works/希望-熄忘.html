<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>希望 熄忘 · 游戏开发 · _DEV.LOG</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;700&family=Fira+Code:wght@400;500&display=swap');
:root{--bg:#030810;--dim:#0a1628;--text:#c8e0f0;--muted:#3a5a7a;--cyan:#00f5ff;--magenta:#ff006e;--yellow:#ffe600;--glow-c:0 0 8px #00f5ff88,0 0 24px #00f5ff44;--glow-m:0 0 8px #ff006e88,0 0 24px #ff006e44;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,.015) 2px,rgba(0,245,255,.015) 4px);pointer-events:none;z-index:100;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;animation:gridShift 20s linear infinite;}
@keyframes gridShift{to{transform:translateY(60px);}}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:linear-gradient(180deg,rgba(3,8,16,.95),transparent);border-bottom:1px solid rgba(0,245,255,.1);}
.nav-logo{font-family:'Share Tech Mono',monospace;font-size:18px;color:var(--cyan);letter-spacing:4px;text-shadow:var(--glow-c);text-decoration:none;}
.nav-logo span{color:var(--magenta);}
.nav-links{display:flex;gap:28px;}
.nav-links a{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:2px;text-transform:uppercase;transition:color .2s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--cyan);transition:width .3s;}
.nav-links a:hover{color:var(--cyan);}
.nav-links a:hover::after{width:100%;}
.page-wrap{position:relative;z-index:1;padding:88px 10vw 80px;}
@media (max-width: 768px){
nav{padding:14px 16px;align-items:flex-start;gap:12px;}
.nav-logo{font-size:15px;letter-spacing:3px;}
.nav-links{gap:12px;flex-wrap:wrap;justify-content:flex-end;}
.nav-links a{font-size:11px;letter-spacing:1px;}
.page-wrap{padding:84px 5.5vw 56px;}
}

.back-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--cyan);text-decoration:none;letter-spacing:2px;padding:8px 18px;border:1px solid rgba(0,245,255,.35);background:rgba(0,245,255,.05);transition:all .2s;}
.back-btn:hover{color:#fff;border-color:var(--cyan);background:rgba(0,245,255,.12);}
.nav-btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px;}
@media(max-width:768px){.nav-btns{margin-bottom:24px;}.back-btn{font-size:10px;letter-spacing:1px;padding:7px 14px;}}
.wd-header{width:min(100%, 720px);max-width:100%;margin:0 auto 40px;}
.wd-tag{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--magenta);letter-spacing:4px;margin-bottom:12px;display:block;}
.wd-title{font-size:clamp(28px,5vw,48px);font-weight:700;color:#fff;margin-bottom:16px;}
.wd-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
.wd-tag-item{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--cyan);border:1px solid rgba(0,245,255,.3);padding:3px 8px;letter-spacing:1px;}
.wd-cover{width:min(100%, 720px);max-width:100%;max-height:500px;object-fit:cover;border:1px solid rgba(0,245,255,.15);display:block;margin:0 auto 16px;}
.wd-body{width:min(100%, 720px);max-width:100%;margin:0 auto;font-size:15px;overflow-wrap:anywhere;}
.wd-body h2{font-size:22px;font-weight:700;color:#fff;margin:32px 0 12px;padding-left:12px;border-left:3px solid var(--magenta);}
.wd-body h3{font-size:18px;font-weight:700;color:#fff;margin:24px 0 10px;padding-left:10px;border-left:2px solid var(--cyan);}
.wd-body p{margin:0 0 16px;line-height:1.9;color:var(--text);}
.wd-body a{color:var(--cyan);border-bottom:1px solid rgba(0,245,255,.3);text-decoration:none;}
.wd-body strong{color:#fff;font-weight:700;}
.wd-body blockquote{border-left:3px solid var(--cyan);padding:12px 20px;margin:20px 0;background:rgba(0,245,255,.04);color:var(--muted);line-height:1.9;}
.wd-body ul,.wd-body ol{margin:8px 0 16px;padding-left:1.7em;}
.wd-body ul{list-style:disc outside;}
.wd-body ol{list-style:decimal outside;}
.wd-body li{margin-bottom:8px;line-height:1.9;color:var(--text);padding-left:.15em;}
.wd-body li>div,.wd-body li>p{margin:0;}
.wd-body .ace-line,.wd-body > div:not(.table-wrap):not(.video-embed){margin:0 0 16px;line-height:1.9;color:var(--text);}
.wd-body img{max-width:100%;border:1px solid rgba(0,245,255,.15);margin:16px auto;display:block;}
.wd-body .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0;}
.wd-body table{width:100%;min-width:560px;border-collapse:collapse;margin:16px 0;font-size:14px;}
.wd-body table td,.wd-body table th{border:1px solid rgba(0,245,255,.25);padding:10px 14px;color:var(--text);line-height:1.6;}
.wd-body table th{background:rgba(0,245,255,.06);color:#fff;font-weight:600;}
.wd-body pre{background:#060d18;border:1px solid rgba(0,245,255,.15);padding:16px 20px;font-family:'Fira Code',monospace;font-size:13px;color:#a8c8e8;overflow-x:auto;overflow-y:hidden;margin:16px 0;white-space:pre;}
.wd-body pre code{display:block;min-width:max-content;}
.video-embed{position:relative;width:100%;padding-bottom:56.25%;margin:24px 0;background:#000;}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
@media (max-width: 768px){
  .back-btn{font-size:10px;letter-spacing:1px;padding:7px 14px;}
  .nav-btns{margin-bottom:24px;}
  .wd-header{margin-bottom:28px;}
  .wd-tags{margin-bottom:24px;}
  .wd-cover{max-height:320px;}
  .wd-body h2{font-size:20px;margin:26px 0 10px;padding-left:10px;}
  .wd-body h3{font-size:17px;margin:22px 0 8px;padding-left:8px;}
  .wd-body ul,.wd-body ol{padding-left:1.4em;}
  .wd-body table{font-size:13px;min-width:480px;}
  .wd-body table td,.wd-body table th{padding:8px 10px;}
  .wd-body pre{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;border-left:none;border-right:none;overflow-x:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding:12px 5.5vw;font-size:12px;}
  .wd-body pre code{min-width:max-content;}
  .wd-body .table-wrap{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;overflow-x:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding:0 5.5vw;}
}
</style></head><body>
<nav>
  <div class="nav-logo">_<span>DEV</span>.LOG</div>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/blog/">博客</a>
    <a href="/works/">项目</a>
    <a href="/gallery/">创作</a>
    <a href="/about/">关于</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="nav-btns">
    <a class="back-btn" href="/">← 首页</a>
    <a class="back-btn" href="/works/">← 返回项目</a>
  </div>
  <div class="wd-header">
    <span class="wd-tag">// WORKS</span>
    <h1 class="wd-title">希望 熄忘</h1>
    <div class="wd-tags"><span class="wd-tag-item">IN PROGRESS</span><span class="wd-tag-item">ROGUELIKE</span><span class="wd-tag-item">CARDGAME</span><span class="wd-tag-item">UNITY</span></div>
  </div>
  <div class="wd-body"></div>
</div>
<script>
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){if(e.target.tagName==='IMG')e.preventDefault();});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S'||e.key==='p'||e.key==='P'))e.preventDefault();
    if(e.key==='PrintScreen')e.preventDefault();
  });
  var cover=document.querySelector('.wd-cover[data-full-src]');
  if(cover){
    var full=cover.getAttribute('data-full-src');
    var thumb=cover.getAttribute('src');
    if(full&&full!==thumb){
      var swap=function(){
        var img=new Image();
        img.decoding='async';
        img.onload=function(){cover.src=full;};
        img.src=full;
      };
      if('requestIdleCallback' in window) requestIdleCallback(swap,{timeout:1500});
      else setTimeout(swap,300);
    }
  }
})();
</script>
</body></html>
